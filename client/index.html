<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beljot-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget=resizes-content: Android Chrome 108+ shrinks the
         layout viewport when the on-screen keyboard opens, so full-screen
         overlays (chat dock) keep their header/footer visible. iOS Safari
         ignores it — handled there via useVisualViewport. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Beljot.online</title>
    <!-- Paints the signed-in player's brass mode before the session restores;
         useThemeSync takes over (and clears it on sign-out) once it has. -->
    <script>
      try {
        if (localStorage.getItem("beljot.theme") === "brass") {
          document.documentElement.classList.add("brass-mode");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
