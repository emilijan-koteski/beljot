<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beljot-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget=resizes-content: Android Chrome 108+ shrinks the
         layout viewport when the on-screen keyboard opens, so full-screen
         overlays (chat dock) keep their header/footer visible. iOS Safari
         ignores it — handled there via useVisualViewport. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Beljot.online</title>
    <meta
      name="description"
      content="Play Bitola and Croatian Beljot with friends or bots, and climb the season leaderboard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beljot.online" />
    <meta property="og:title" content="Beljot.online · Play Beljot online" />
    <meta
      property="og:description"
      content="Play Bitola and Croatian Beljot with friends or bots, and climb the season leaderboard."
    />
    <meta property="og:image" content="https://beljot.online/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dama, the Beljot hostess, presenting the brass Beljot chip"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Paints the stored theme (the player's or the visitor's, brass by default) before
         the app loads; useThemeSync takes over once the session restores. -->
    <script>
      var storedTheme = null;
      try {
        storedTheme = localStorage.getItem("beljot.theme");
      } catch {}
      if (storedTheme !== "parchment") {
        document.documentElement.classList.add("brass-mode");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
