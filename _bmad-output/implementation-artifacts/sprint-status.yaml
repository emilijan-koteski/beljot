gs a down-then-up cycle destroys (pardons, and the double-disconnect rule), and records the stale claim so it is not restored. Comment-only, no SQL statement changed, DROPs re-verified against the live dev schema inside a rolled-back transaction. Epic 9 is COMPLETE after this story: epic-9-retrospective is now on the radar → review; 9-8 code-reviewed (3-layer adversarial: Blind Hunter + Edge Case Hunter + Acceptance Auditor, all three green first run over `git diff a3631ef..HEAD`) — 29 raw findings → 22 unique, 1 PO decision resolved + 16 patches applied, 6 deferred, 0 dismissed (every layer had already self-filtered its own cleared suspicions, which is why nothing was noise). ALL THREE layers independently converged on the same HIGH defect: `StartMatch` commits `Status = "playing"` in its outer tx, then runs the honor prefilter post-commit, and on a honor-READ failure returned bare with NO revert — while the two sibling failure paths directly below it (GetBalances, ChargeStakes) and `ejectSeatsAtStart`'s own tx-failure branch all un-brick. The room was left `playing` with no session, and join/start/return/LEAVE all then refuse, trapping all four players until the next boot reconcile; the existing test asserted 500 + no-ejection + no-push but never status, so it reproduced the bug and certified around it. Fix distinguishes the 409 (ejectSeatsAtStart owns the cleanup) from the read error, and the new status assertion was PROVEN to fail without it (`actual: "playing"`). Auditor's conformance table: AC6 PARTIAL on that defect, all other AC1-AC12 and all D1-D8 SATISFIED, with AC8's zero-drift-gate claim independently re-verified BOTH ways (two contract files changed; `events_contract_test.go` / `testdata/events/` / `wsEvents.schemas.ts` / `wsEvents.contract.test.ts` untouched and free of any reference), all ten truth-table rows re-derived, the DB-backed GORM-trap tests confirmed RUNNING not skipping, and 9.3's insolvency tests confirmed unedited. ONE AC amended by PO decision: the D1×D7 interaction — a New Player creator was never score-checked, so a 0-completed/4-abandoned account (score 19) could create a `min_honor 80` room and ONE finished match (→23) got them ejected from their own room. The self-gate now score-checks a New Player against THEIR OWN CURRENT SCORE; note the decision was minuted as "cap at the 80 prior", which would NOT have closed that case, so the rule was corrected to own-score during implementation and the two tests that pinned the old behaviour (Go `...MaySetHighThreshold`, Vitest "lets a new-player owner set a high threshold") were rewritten — D1 at the JOIN gate is untouched and now pinned by its own test. Other patches: `MatchPage` return-catch honor branch (D3's primary checkpoint had no handler at all — the player stayed on a dead result overlay with a misleading toast and uncleaned match state, with none of the dropped-frame fallback insolvency gets); `RoomPage.handleStartGame` honor branch + new non-disclosing `room.errors.honorGateStart` ×4 (the owner got "try again", advice futile by construction); `en.json roomClosedBody` reworded off "could afford to host it" — the reuse of `system:room_closed_insolvent` was justified on the claim that its copy is reason-agnostic, true of sr/mk/hr but NOT of en, so English alone told an honor-closed room it was a money problem; `ejectReturner`'s `ownerEligible` aligned to `startEligible`'s nil-balances shape (it still carried the inverted form that is 9.3's "closed a room with solvent heirs" finding); heir-candidate honor read hoisted under `OwnerID == userID` (it ran on every non-owner ejection and could 500 out of an ejection its predicate never fed); `honorSnapshotFor` now errors on a filtered-out subject instead of handing back a zero snapshot that reads as experienced/score-0 and clears a veterans-only room; `CreateRoomModal` gained `honorKnown` so the cosmetic mirror no longer turns "unknown" into "denied" (`honorIsNewPlayer(undefined)` is `true` by design, which blocked a veteran from making a veterans-only room the server would allow); `RoomCreatedPayload`/`RoomUpdatedPayload` given the two keys `roomLifecyclePayload` already sends; stale `ejectInsolventAtStart` comment, `useRoomEjectRedirect` doc comment, `JoinByCodeTile`'s false generic-variant premise, and a caveat on the decorative `honorOf`/`newPlayerHonorOf` totals; join-error test matrix completed 3/4 → 4/4. Deferred ×6, all pre-existing or unreachable: return-gate-before-status-check (shared with 9.3's insolvency gate, trigger unproven), per-user ejection push fanning out on a rolled-back tx (unchanged 9.3 — `player_left` IS guarded, the push deliberately is not), two other hand-built room payloads omitting the keys (they already omit `isPrivate`/`coinBuyIn` — the real fix is routing all three through `roomLifecyclePayload`), `ejectNotice` conflating the two rejection reasons (confirmed UNREACHABLE today; widen it with the deferred owner-edit endpoint, which is what makes it live), insolvency transfer not applying the honor predicate (not an AC7 violation, consistent with the lazy design), and the hoisted-candidate-read heir race. One finding fixed only in part and said so: `ejectReturner`'s GetBalances ERROR path still 500s rather than degrading, because that is unchanged 9.3 code shared with insolvency. Gates re-run in review, not inherited: gofmt clean except the pre-existing profile_identity_handler_test.go, go vet clean, golangci-lint v1.64.8 clean, go test ./... 18/18 packages with the DB-backed honor tests passing not skipping (dev DB 5433), tsc clean, vitest 101 files / 1099 tests, eslint clean (1 import-sort autofix), prettier clean, i18n 861 keys ×4 with zero missing/extra, zero placeholder mismatches, zero em dash in sr/mk/hr, mk all-Cyrillic → done; 9-8 manual E2E (Playwright, post-patch, Go rebuilt from source on 8080 + Vite 5173 + dev DB 5433 at migration 18, five accounts with SQL-set honor weights) — NO new defect found, unlike 9.6 whose E2E found two. Confirmed in the wild what review could only reason about: AC2's GORM trap (a UI-created veterans-only room persisted allow_new_players=false, the value a default:true tag would have flipped), D5 decisively (user 1876's honor_score snapshot column still read 80 while TopBar and the gate both used the recomputed 29), and D1 BOTH halves (a min_honor=0 + veterans-only room rejected a New Player with NEW_PLAYER_NOT_ALLOWED, which the epic's nesting would have admitted; and a New Player on the 80 prior was ADMITTED to a min_honor=85 room with the score never consulted). Both patched messages rendered live: the owner start-failure key ("A player doesn't meet this room's honor requirement — the match didn't start", replacing the futile "try again") and the New Player create cap (409 at 95, 201 at exactly 80 — this returned 201 before the fix). AC6 end-to-end on the start path (newcomer ejected, seat freed, room reverted to waiting NOT stranded in playing, zero matches created, owner 409) and the return path (409 + seat freed), with the ejection modal rendering from a genuine system:honor_ejected push (shield icon, interpolated 90/29 via data-min-honor/data-honor). All three join entry points surfaced correctly (lobby card composed "asks for honor 85 … Yours is 30"; join-by-code param-less generic; deep link bounced to /lobby). Task 12's 320px concern, left UNVERIFIED by the review, is now CLOSED: a maximally-chipped card (timer + buy-in + 95+ + Veterans only) wraps across three lines at 320px with scrollWidth 310 < 320 and zero overflowing elements. Zero server ERROR lines, zero JS exceptions. NOT covered, stated rather than implied: patch #7's MatchPage return-catch branch specifically (the WS route to the modal is verified; reaching the match-result overlay needs a real four-player match played to completion — the branch is unit-tested) and patch #1's revert in the live app (needs an injected mid-start DB failure; proven instead by a unit test verified to fail without the fix, actual "playing"). Incidental non-9.8 observation for a future logging pass: Echo's logging middleware records apperr responses as status 200 (a 401 probe and every 409 gate rejection logged 200 while the client received the real code) — pre-existing, affects every apperr. E2E test rooms soft-deleted and the dev lobby restored to its original 2 open rooms; the five hg.test accounts were left in place, consistent with the existing test-account population; HONOUR REDESIGN implemented on the same branch (spec-honour-redesign.md, from Claude Design project 8fb598bd "Honour System - Redesign", nine surfaces R1-R9) — presentation only, with the server contract, the five tier bands (95/85/70/50), the 80 prior and the 5-match floor all verified UNCHANGED before any code. Two documented reversals, both minuted as PO decisions 2026-07-31: (1) per-seat honour in the waiting room OVERRIDES 9.8's scope table, which defers "cross-player honor visibility" to Epic 11 Story 11.3 — accepted because honour is already public via ProfileResponse, so the roster reveals nothing new while being the place the information finally does work; (2) this redesign OVERRIDES 9.8's guardrails on 9.7's surfaces, deleting HonorPanel.tsx outright and rewriting honor.ts's presentation layer (those guardrails existed to stop 9.8 drifting into 9.7's territory, not to freeze it forever). FIVE factual errors in the design were corrected rather than implemented: there is no XP row on the result overlay (honour is the SECOND settlement row, not the third — XP surfaces via LevelUpDialog outside the match); the abandonment overlay has no settlement rows at all so "same treatment" would mean building the list; the abandoning player never receives event:honor_updated (Hub.SendToUser is an unqueued no-op) so "you dropped 96->91" cannot be WS-driven; DurationSlider's tick interval was a hardcoded v+=10 so tier boundaries at 50/70/85/95 were inexpressible; and `bg-surface-2` generates no CSS (--surface-2 has no --color-* alias), so HonorPanel's count tiles had been rendering transparent since 9.7. THREE drawn items were dropped because the client provably cannot compute them, each recorded in deferred-work.md with the exact field required: the TopBar "2/5" counter (counts are not on the auth envelope — the profile band DOES show it, so the two surfaces are deliberately asymmetric), and the recovery estimate + R2's "two more matches" line (underdetermined — the client knows only the ratio E=D(100-s)/s, not D, because the decayed weights and honor_decayed_at are all json:"-"; substituting the raw undecayed totals assumes no decay and would contradict the score on the same screen). Foundation first, because tier colour was duplicated in HonorPanel and TopBar and the two HAD ALREADY DRIFTED (they disagreed on `fair`) with nothing in TypeScript able to notice, and the redesign adds five more consumers: --h1..--h5 ramp + soft/line variants in :root, REDECLARED under the same names inside .game-table (the established --accent/--ink pattern) so one scope-blind map serves parchment and felt; HONOR_TIER_BANDS derived from the floors so gradient/ticks/bucketing cannot disagree; and a single <HonorShield> component pairing colour with a per-tier GLYPH, which makes the drift structurally impossible rather than merely discouraged. Screens: R1 tier word visible from lg (preserving 9.7's measured lg gate — at 640-1023px the row already carries nav links plus the username pill and a word there made the chip wrap) and the chip is now a button opening R2; R2 new shared explainer stating the two facts players actively get wrong (surrender counts as finished; old abandonments decay), deep-linking to /rules#honour; R3 HonorPanel DELETED and folded into IdentityHero as a full-width band with a banded meter, its test suite ported case-for-case including the deliberate "real score stays on data-* while suppressed"; R4 lobby shield tinted by the REQUIREMENT's tier (not the viewer's, so the chip stays a property of the room), Join becomes Locked and fires no request, plus a pure-client "I qualify" filter; R5 the free-typed number becomes the extended slider with tier-boundary ticks, tier-coloured fill, 0 as "Anyone" and the host's own score marked on the track, and BOTH hints deleted (Open Question 6's steer survives in the ticks rather than in prose); R6 the waiting room finally shows the gate at all — badges row plus per-seat shields showing each player's OWN tier (a seat at 71 is Fair and gets the stone shield, never a red X) with an ember ring on the tile carrying the room's verdict instead, and Start disabled with the reason in title; R7 viewer-relative reconnect note (the one screen where the cost is still avoidable) and a MatchResult honour row driven by a client-side previous-score stash, reset in BOTH the match_end and match_abandoned handlers exactly as useWsDispatch's own comment had demanded of any future flourish; R8 to-scale comparison plus a DOOR OUT ("Rooms I qualify for", routing to the pre-filtered lobby); R9 new honour section in all four rules content locales. Server work was the ONE piece in scope: RoomPlayer gains HonorScore *int / HonorTier *string (POINTERS so a real 0 is distinguishable from "not read"), hydrated by attachPlayerHonor via the already-injected HonorForUsers and DELIBERATELY LENIENT unlike the gate's reader — a failed read, a missing row, a bot or a nil service yields no shield and never a failed request, because taking the whole waiting room down to avoid drawing a shield would be the worse failure. ZERO WS drift-gate touchpoints, verified by git diff over events_contract_test.go, testdata/events/, wsEvents.schemas.ts, wsEvents.contract.test.ts, ws/events.go and wsEvents.ts (all empty — nothing crosses the WS contract at all). Gates: gofmt clean except the pre-existing profile_identity_handler_test.go, go vet clean, golangci-lint v1.64.8 clean, go test ./... all packages ok with the DB-backed honour tests passing not skipping (dev DB 5433), tsc clean, vitest 101 files / 1118 tests (baseline 1096, +22), eslint clean, prettier clean, i18n 886 keys x4 with zero missing/extra, zero placeholder mismatches, mk all-Cyrillic and zero em dash in sr/mk/hr (the pre-existing count of 1 in each rules content file unchanged). NOT DONE and stated rather than implied: manual E2E has not been run for the redesign — every gate above is automated, 9.6 found two real bugs in manual E2E AFTER its review passed, and this touches nine surfaces including two responsive decisions (the lg tier word, the 320px badges row) that automated tests cannot judge. Four items deferred: the TopBar counter, the recovery estimate, the abandoning player's missing honour row (a newly-VISIBLE consequence of 9.7's unqueued-push limitation — showing nothing is the honest degradation, and the stash is reset in both handlers so a stale movement is never shown instead), and the dead bg-surface-2 class still in MatchHistory.tsx. 2026-08-15 bmad-code-review: 11-2-friend-requests-and-friend-list → done (3-layer adversarial: Blind Hunter + Edge Case Hunter + Acceptance Auditor; Edge/Auditor each re-run once after an empty first dispatch, all three then contributed; auditor found AC1–AC9 all SATISFIED). 1 decision-needed + 4 patches applied (5 total), 0 deferred, 1 dismissed. DECISION (fix now, PO): the reverse-duplicate friendship race — non-atomic FindByPair→Create with a single-direction unique index let two mutual requests (A→B ∥ B→A) both insert, yielding duplicate rows / a friend listed twice; all three layers converged. Fixed by normalizing migration 000019's unique index to (LEAST(user_id,friend_id), GREATEST(user_id,friend_id)), so the losing racer's INSERT hits 23505 → the existing ErrFriendRequestExists 409 (migration re-applied down/up on dev DB 5433; the reverse-dup repo test rewritten from "not blocked by index" to "blocked by normalized index" and verified PASSING). Client patches: friend mutations gained onError toasts (send/accept/decline 409/404 no longer swallowed silently) + friends.errors.{send,accept,decline}Failed ×4 (mk all-Cyrillic, no em dash in mk/sr/hr, parity green); the system:friend_request WS dispatch now also invalidates friends.status(fromUserId) so a viewer on the sender's profile doesn't keep a stale "Add friend" button (→ silent 409) and guards payload with optional chaining (TypeError on a null/missing frame); FriendButton's load/error fallback split — a neutral skeleton while pending and the actionable "none" affordance on a status-query error instead of a permanently-dead disabled "Add friend". Dismissed: sendFriendRequest/accept/decline typed Promise<void> while returning a DTO (cosmetic, no consumer). Gates re-run in review (toolchains via mise): gofmt clean, go vet clean, go build ./... clean, golangci-lint v1.64.8 (pinned via go run; env's v2.12.2 rejects the v1 config) clean on internal/friend, go test ./... green EXCEPT the pre-existing unrelated TestGormUserRepository_SearchByUsername (Story 11.1 shared-DB E2E pollution from leftover alice_e2e/alicia_e2e — already in deferred-work.md, untouched by 11.2), friend DB tests PASSING against the normalized index (dev DB 5433 @ v19); tsc clean, eslint clean, prettier clean, vitest 107 files / 1140 tests pass, i18n parity green. 2026-08-15 manual E2E (Playwright, make dev — Vite 5173 + Go 8080 + dev DB 5433 @ v19 with the normalized index; two concurrent online users via a real second browser tab): NO new defect. Verified live — AC1 send (A→B "Request sent"); AC2 online push; AC3/AC7 all four FriendButton states (none/pending_outgoing/pending_incoming/friends) observed; AC4 durable requests list with resolved sender username; AC5 accept from the lobby panel; AC6 friend list ONLINE (with invite-to-room affordance) AND OFFLINE (affordance correctly hidden); AC8 both lobby surfaces + online-gated invite hook. PATCH C confirmed decisively: with B sitting on A's public profile, A's send flipped B's button "Add friend"→"Accept request" live via the system:friend_request WS push (no reload) — the exact stale-button→silent-409 the patch closes. 11.1 search→11.3 profile→11.2 add-friend integration verified end-to-end. DB showed a single accepted row (202→528, created→updated on accept), corroborating the single-row invariant; zero console errors. NOT live-triggered (code+unit-verified only): patch B error toast (needs an engineered 409/404 race), patch D skeleton/error fallback, patch E null-payload guard (unreachable from our server). Test artifacts cleaned: friendship row deleted, throwaway friendB_e2e soft-deleted. 2026-08-16 bmad-code-review: 11-4-friend-whisper-chat → done (3-lens adversarial: Blind Hunter + Edge Case Hunter + Acceptance Auditor — the parallel-subagent mechanism failed to execute in this env [both dispatch rounds returned 0 tool_uses], so all three lenses were run directly in the main thread over `git diff HEAD` [baseline b17cac7 = HEAD; the 11-4 work is the whole uncommitted working tree, whole-epic-on-one-branch]). AC1–AC8 + D1–D5 ALL independently verified in code, not from checkboxes: AreFriends direction-agnostic (both (a,b)/(b,a)), anti-collusion same-RoomID covers waiting+playing via FindPlayerRoom, explicit hub.IsConnected offline pre-check (D4), fail-closed on every internal error (sender FindByID / target FindByUsername / AreFriends / ActiveRoomID — no leak, no delivery), unknown username → not_friends (no enumeration), self-whisper rejected by resolved ID, own-echo to BOTH, rune-cap (not byte-cap) at 500, ephemeral (no model/repo/migration/DB write, D5), clearWhispers wired into logout alongside all channels (AC6, whisper matches the global lobby-channel lifecycle), drift-gate GENUINELY untouched (zero whisper refs in events_contract_test.go / wsEvents.schemas.ts / wsEvents.contract.test.ts / testdata goldens — AC7/D1), i18n 1:1 parity ×4 + mk all-Cyrillic (the /w in mk is the literal command token, correct in every locale) + no em dash in mk/sr/hr (AC8), typeof-guarded numerics on dispatch (never JS-truthiness on Go zero values), immutable Zustand updates, XSS-safe escaped-JSX render, all four --whisper-* CSS tokens defined in :root + .chat-dock-match. 4 findings (2 decision-needed + 1 patch + 1 defer), 5 dismissed as noise. 2 decisions resolved (PO): (1) MEDIUM closed-dock whisper had NO notification — the FAB badge counted only primary-channel messages and tab unread badges render only while the dock is open, so a whisper to an idle lobby player (dock closed = default state) was silent until they happened to open the dock → PATCHED: whisperUnreadTotal folded into the closed FAB badge (badgeCount = unread + whisperUnreadTotal), numeric only, no content peek (privacy), +1 regression test; (2) LOW Tab-key channel cycling hijacks input focus whenever ≥1 thread exists even on the primary channel (a keyboard user can't Tab to Send / out of the dock) → DEFERRED (spec-mandated AC5 Valorant-style cycling, low impact — Send clickable + Enter sends; a11y-pass candidate, deferred-work.md). Second patch: fail-closed handler branches (presence/target/sender lookup errors) were untested → added 3 tests + opt-in error injection on userRepoStub (default nil, chat tests unaffected). One defer: draft cleared optimistically before a whisper can be rejected (lost text on not_friends/blocked/offline) — inherits chat's no-delivery-ack pattern, deferred-work.md. Dismissed: sendError payload key shape (client ignores whisper error payloads), unbounded thread count (bounded by friend list), markThreadRead unused-in-component (used in tests), nanosecond React-key collision (theoretical), case-sensitive whisper target (spec-intended, "no ILIKE"). Gates re-run in review (mise toolchains): go build ./... clean, go vet ./internal/chat/... clean, gofmt clean on changed files, go test ./internal/chat/... ok (DB-free whisper fakes, +3 new fail-closed tests pass); tsc -p tsconfig.build.json clean, eslint clean, prettier clean, vitest 124 pass across ChatDock (7, +1 closed-dock FAB test) / chatStore / useWsDispatch. NOT re-run: full go test ./... (other packages need dev DB :5433; whisper path is DB-free and build ./... compiles clean). 2026-08-16 live E2E (make dev — Postgres :5433 @ v19 + Go :8080 + Vite :5173; 3 live WS clients via a Node 22 native fetch/WebSocket driver, NOT a browser — @playwright/test is not installed and the Playwright MCP browser tools were unavailable, so the React UI [tab switcher, pink bubbles, Tab-cycling, the new closed-FAB whisper badge] was NOT browser-exercised and remains vitest-only; the server-authoritative surface was fully verified): 22/22 assertions PASS — friend whisper delivered to BOTH participants both directions + uninvolved third client silent; non-friend/unknown-username → error:not_friends (no enumeration, target silent); self-whisper ignored; rune cap 500 ok / 501 rejected; anti-collusion LIVE (alice created a free public room + bob joined → error:whisper_blocked_in_game, target never reached; after bob POST /rooms/:id/leave the same whisper delivered again); offline LIVE (bob WS closed → hub unregistered → error:whisper_recipient_offline). Throwaway accounts/friendship/room hard-deleted from the dev DB (0 residue verified); room_players auto-cleared by /leave (0 rows before explicit delete). Stack stopped, Postgres left up. Story 11.4 remains done; 11-5-friend-room-invites is the last Epic 11 story (ready-for-dev).
